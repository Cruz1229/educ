<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Magix</title>
  <desc id="desc">Triángulo mágico con seis posiciones numéricas</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f4f7"/>
      <stop offset="1" stop-color="#fff1e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#173042" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>
  <path d="M128 38 42 204h172L128 38Z" fill="none" stroke="#176b87" stroke-width="15" stroke-linejoin="round" filter="url(#shadow)"/>
  <g fill="#f47c67" stroke="#fff" stroke-width="5" font-family="system-ui,sans-serif" font-size="20" font-weight="800" text-anchor="middle">
    <circle cx="128" cy="39" r="24"/><circle cx="85" cy="121" r="24"/><circle cx="43" cy="204" r="24"/>
    <circle cx="128" cy="204" r="24"/><circle cx="213" cy="204" r="24"/><circle cx="171" cy="121" r="24"/>
  </g>
  <g fill="#fff" font-family="system-ui,sans-serif" font-size="20" font-weight="800" text-anchor="middle" dominant-baseline="central">
    <text x="128" y="39">1</text><text x="85" y="121">2</text><text x="43" y="204">3</text>
    <text x="128" y="204">4</text><text x="213" y="204">5</text><text x="171" y="121">6</text>
  </g>
</svg>
